name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log in to Docker Hub
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: containinger
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Determine mutable alias eligibility
      id: aliases
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        set -euo pipefail
        newest=false
        newest_major=false
        newest_minor=false
        current="${GITHUB_REF_NAME}"

        # Only vMAJOR.MINOR.PATCH (no pre-release suffix) may move aliases.
        if [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          major="${current#v}"
          major="${major%%.*}"
          minor_prefix="${current%.*}"
          minor_re="$(printf '%s' "$minor_prefix" | sed 's/\./\\./g')"

          releases="$(
            { git tag -l 'v*'; printf '%s\n' "$current"; } \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -u -V -r
          )"

          newest_tag="$(printf '%s\n' "$releases" | head -n1)"
          newest_major_tag="$(printf '%s\n' "$releases" | grep -E "^v${major}\\." | head -n1 || true)"
          newest_minor_tag="$(printf '%s\n' "$releases" | grep -E "^${minor_re}\\." | head -n1 || true)"

          if [[ "$newest_tag" == "$current" ]]; then newest=true; fi
          if [[ "$newest_major_tag" == "$current" ]]; then newest_major=true; fi
          if [[ "$newest_minor_tag" == "$current" ]]; then newest_minor=true; fi
        fi

        {
          echo "newest=$newest"
          echo "newest_major=$newest_major"
          echo "newest_minor=$newest_minor"
        } >> "$GITHUB_OUTPUT"

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: containinger/artifactshelf
        flavor: |
          latest=false
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}},enable=${{ steps.aliases.outputs.newest_minor == 'true' }}
          type=semver,pattern={{major}},enable=${{ steps.aliases.outputs.newest_major == 'true' }}
          type=raw,value=latest,enable=${{ steps.aliases.outputs.newest == 'true' }}
          type=ref,event=branch
          type=ref,event=pr

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: mode=max
        cache-from: type=gha
        cache-to: type=gha,mode=max
